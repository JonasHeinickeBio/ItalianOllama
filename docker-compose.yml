# Secure docker-compose for LLM-based language learning workflow
# Includes: OpenWebUI, Neo4j, Ollama, and Python services for aisuite/hellmholtz

services:
  # Neo4j Graph Database for memory/knowledge graph
  neo4j:
    image: neo4j:5.26-community
    container_name: italianollama-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_logs_query_enabled=INFO
      - NEO4J_dbms_logs_query_threshold=1s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network

  # Ollama Local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: italianollama-ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 8g
    cpus: 4
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network

  # OpenWebUI for user interface
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: italianollama-openwebui
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=false
      - DEFAULT_LOCALE=en
      - session_length=86400
      - API_KEY=${OPENWEBUI_API_KEY:-}
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network

  # Python service for aisuite and hellmholtz
  language-learning-service:
    build:
      context: .
      dockerfile: Dockerfile.language-service
    container_name: italianollama-language-service
    environment:
      # Neo4j connection
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j

      # Ollama connection
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}

      # AISuite configuration
      - AISUITE_PROVIDER=${AISUITE_PROVIDER:-ollama}
      - AISUITE_API_KEY=${AISUITE_API_KEY:-}

      # Blablador (Helmholtz LLM) configuration
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY}
      - BLABLADOR_API_URL=${BLABLADOR_API_URL}
      - BLABLADOR_MODEL=${BLABLADOR_MODEL:-alias-fast}

      # Hellmholtz configuration
      - HELMHOLTZ_CONFIG_PATH=/app/config/hellmholtz.yaml

      # General
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network
    user: "1000:1000"

  # Optional: Neo4j Browser (accessible UI for Neo4j)
  neo4j-browser:
    image: neo4j:5.26-community
    container_name: italianollama-neo4j-browser
    environment:
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7473:7474"
    restart: unless-stopped
    depends_on:
      - neo4j
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network
    profiles:
      - debug

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  ollama_models:
    driver: local
  openwebui_data:
    driver: local

networks:
  italianollama-network:
    driver: bridge
    name: italianollama-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

secrets:
  neo4j_password:
    file: ./secrets/neo4j_password.txt
  webui_secret_key:
    file: ./secrets/webui_secret_key.txt
  openwebui_api_key:
    file: ./secrets/openwebui_api_key.txt
  blablador_api_key:
    file: ./secrets/blablador_api_key.txt
  blablador_api_url:
    file: ./secrets/blablador_api_url.txt
  blablador_model:
    file: ./secrets/blablador_model.txt
