# Italian Tutor - Docker Compose
#
# Two modes supported:
#   1. Local mode (default): Ollama + LiteLLM + Neo4j (offline-capable)
#   2. Cloud mode: Blablador API + Neo4j (uses external LLM)
#
# Quick Start - Local (Offline):
#   cd backend && docker compose up -d
#   http://localhost:8501 (Chainlit)
#
# Quick Start - Cloud (Blablador):
#   Set USE_AURA=false, BLABLADOR_API_URL in .env
#   docker compose up -d
#   http://localhost:8501 (Chainlit)

services:
  # ============================================
  # FastAPI Backend - Core API
  # ============================================
  fastapi:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: italian-tutor-api
    user: "1000:1000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Neo4j (local or Aura via USE_AURA flag)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-admin}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # LLM Mode Selection
      # - Local: LiteLLM routes to Ollama
      # - Cloud: Blablador direct API (set BLABLADOR_API_URL in .env)
      - LITELLM_BASE_URL=http://host.docker.internal:4000
      - LITELLM_MODEL=${LITELLM_MODEL:-tutor}
      - BLABLADOR_API_URL=${BLABLADOR_API_URL:-}
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY:-}
      - BLABLADOR_MODEL=${BLABLADOR_MODEL:-alias-fast}
      - USE_AURA=${USE_AURA:-false}
      - USE_BLABLADOR_DIRECT=${USE_BLABLADOR_DIRECT:-false}
    env_file:
      - ../.env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - italian-tutor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=fastapi"

  # ============================================
  # LiteLLM - LLM Proxy (Routes to Blablador or Ollama)
  # ============================================
  litellm:
    image: litellm/litellm:v1.82.3-stable.patch.2
    container_name: italian-tutor-litellm
    user: "1000:1000"
    volumes:
      - ./litellm:/app/litellm:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    command: ["--config", "/app/litellm/litellm_config.yaml", "--host", "0.0.0.0", "--port", "4000", "--drop_params"]
    environment:
      - LITELLM_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-1234}
      - LITELLM_DISABLE_TELEMETRY=True
      - SPEND_LOGGING=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health\")'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - italian-tutor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=litellm"

  # ============================================
  # Neo4j - Graph Database
  # ============================================
  # Local mode (default): neo4j container
  # Cloud mode (USE_AURA=true): Use Neo4j Aura instead of this container
  neo4j:
    image: neo4j:latest
    container_name: italian-tutor-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-admin}
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_server_logs_debug_enabled=false
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7688:7687"
      - "7475:7474"
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || nc -z localhost 7474"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - italian-tutor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=neo4j"

  # ============================================
  # Chainlit - Chat Interface
  # ============================================
  chainlit:
    build:
      context: ..
      dockerfile: src/italianollama/frontend/Dockerfile
    container_name: italian-tutor-chainlit
    user: "1000:1000"
    environment:
      # Backend API Configuration (matches italianollama.frontend.config)
      - BACKEND_URL=http://fastapi:8000
      - BACKEND_TIMEOUT=240
      - DEFAULT_STUDENT_ID=demo
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Chainlit Configuration
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8501
      # Logging
      - LOG_LEVEL=INFO
      # Neo4j credentials (for direct access if needed)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-admin}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    env_file:
      - ../.env
    ports:
      - "${CHAINLIT_PORT:-8501}:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - italian-tutor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=chainlit"

# ============================================
# Volumes - Data Persistence
# ============================================
volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  ollama-data:
    driver: local

# ============================================
# Networks - Service Communication
# ============================================
networks:
  italian-tutor-network:
    driver: bridge
    name: italian-tutor-network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Quick Start Commands
# ============================================
# Local mode (all services including Ollama):
#   cd backend && docker compose --profile local up -d
#
# Cloud mode (Neo4j local + Blablador API):
#   cd backend && docker compose --profile cloud up -d
#
# Blablador direct (no LiteLLM):
#   cd backend && docker compose --profile blablador-only up -d
#
# All services (no profiles):
#   cd backend && docker compose up -d

# ============================================
# Secrets - Sensitive Data Management
# ============================================
# The .env file contains sensitive credentials:
#   - NEO4J_PASSWORD: Database password
#   - BLABLADOR_API_KEY: LLM API key (Blablador)
#   - LITELLM_API_KEY: LiteLLM master key (default: sk-1234)
# 
# .env is already in .gitignore for safety.
# For production, consider using Docker secrets or external secret management.
#
# Example .env for different modes:
#
# LOCAL MODE (Ollama + Neo4j + LiteLLM):
#   NEO4J_URI=bolt://127.0.0.1:7687
#   BLABLADOR_API_URL=
#   USE_AURA=false
#
# CLOUD MODE (Blablador + Neo4j):
#   NEO4J_URI=bolt://127.0.0.1:7687
#   BLABLADOR_API_URL=https://api.helmholtz-blablador.fz-juelich.de/v1/
#   BLABLADOR_API_KEY=your-key-here
#   USE_AURA=false
#
# AURA MODE (Neo4j Aura + Blablador):
#   NEO4J_URI=neo4j+s://your-instance.databases.neo4j.io
#   NEO4J_PASSWORD=your-aura-password
#   BLABLADOR_API_URL=https://api.helmholtz-blablador.fz-juelich.de/v1/
#   BLABLADOR_API_KEY=your-key-here
#   USE_AURA=true
