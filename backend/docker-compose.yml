# Italian Tutor - Docker Compose (Production-ready)
#
# Supports:
#   - External Neo4j Aura (cloud) or local
#   - External LiteLLM or Blablador directly
#   - OpenWebUI for UI
#
# Usage:
#   docker compose -f docker-compose.yml up -d              # Full stack (local)
#   docker compose -f docker-compose.yml -f docker-compose.aura.yml up -d  # With Aura
#   docker compose down

services:
  # ============================================
  # FastAPI Backend (Always needed)
  # ============================================
  fastapi:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: italian-tutor-api
    environment:
      # Neo4j - use env vars or defaults
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - USE_AURA=${USE_AURA:-false}

      # LiteLLM - use external or local
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-dummy}
      - LITELLM_MODEL=${LITELLM_MODEL:-tutor}

      # Direct Blablador (if not using LiteLLM)
      - BLABLADOR_API_URL=${BLABLADOR_API_URL}
      - BLABLADOR_API_KEY=${BLABLADOR_API_KEY}
      - BLABLADOR_MODEL=${BLABLADOR_MODEL:-alias-fast}

      # App settings
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - italian-tutor-network

  # ============================================
  # LiteLLM (Optional - only if using local router)
  # ============================================
  # Uncomment to use local LiteLLM:
  # litellm:
  #   image: ghcr.io/berriai/litellm:main-latest
  #   container_name: italian-tutor-litellm
  #   volumes:
  #     - ./litellm/litellm_config.yaml:/app/config.yaml
  #   environment:
  #     - LITELLM_CONFIG_FILE=/app/config.yaml
  #     - DATABASE_URL=sqlite:///tmp/litellm.db
  #     - LITELLM_MASTER_KEY=dummy
  #   ports:
  #     - "4000:4000"
  #   restart: unless-stopped
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   networks:
  #     - italian-tutor-network
  #   secrets:
  #     - blablador_api_key
  #     - openai_api_key
  #     - anthropic_api_key

  # ============================================
  # OpenWebUI - Frontend
  # ============================================
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: italian-tutor-webui
    environment:
      # Connect to our FastAPI (OpenAI-compatible)
      - OPENAI_API_BASE_URL=http://fastapi:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - ENABLE_SIGNUP=false
      - DEFAULT_LOCALE=it
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me}
    env_file:
      - ../.env
    ports:
      - "3000:8080"
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - italian-tutor-network

# ============================================
# Networks
# ============================================
networks:
  italian-tutor-network:
    driver: bridge
    name: italian-tutor-network

# ============================================
# Secrets (optional - for local services)
# ============================================
# secrets:
#   blablador_api_key:
#     file: ../secrets/blablador_api_key.txt
#   openai_api_key:
#     file: ../secrets/openai_api_key.txt
#   anthropic_api_key:
#     file: ../secrets/anthropic_api_key.txt
