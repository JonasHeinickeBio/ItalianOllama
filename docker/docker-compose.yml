# ItalianOllama Docker Compose
# Use profiles to choose which services to run:
#   docker compose --profile local up -d      # All local services
#   docker compose --profile aura up -d       # Use Neo4j Aura (cloud)
#   docker compose --profile minimal up -d    # API + Ollama only
#   docker compose --profile webui up -d      # API + Ollama + OpenWebUI

services:
  # ============================================
  # Neo4j (local) - Profile: local
  # ============================================
  neo4j:
    image: neo4j:5.26-community
    container_name: italianollama-neo4j
    profiles:
      - local
    environment:
      - NEO4J_AUTH=neo4j
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_logs_query_enabled=INFO
      - NEO4J_dbms_logs_query_threshold=1s
    secrets:
      - neo4j_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $(cat /run/secrets/neo4j_password) 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network

  # ============================================
  # Neo4j Aura (cloud) - Profile: aura
  # ============================================
  # No local Neo4j container - uses cloud instance
  # Add these secrets:
  #   - neo4j_aura_uri.txt    (e.g., neo4j+s://xxxx.databases.neo4j.io)
  #   - neo4j_aura_username.txt
  #   - neo4j_aura_password.txt

  # ============================================
  # Ollama - DISABLED (using Blablador API instead)
  # ============================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: italianollama-ollama
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #     - OLLAMA_MODELS=/root/.ollama/models
  #     - OLLAMA_KEEP_ALIVE=24h
  #     - OLLAMA_NUM_PARALLEL=2
  #     - OLLAMA_MAX_LOADED_MODELS=1
  #   ports:
  #     - "11434:11434"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s
  #   mem_limit: 8g
  #   cpus: 4
  #   security_opt:
  #     - no-new-privileges:true
  #   networks:
  #     - italianollama-network

  # ============================================
  # OpenWebUI - Uses external LLM API (Blablador/Ollama)
  # ============================================
    openwebui:
  image: ghcr.io/open-webui/open-webui:main
  container_name: italianollama-openwebui
  profiles:
    - local
    - aura
    - webui
  environment:
    # Use external LLM API (Blablador or Ollama on host)
    - OLLAMA_BASE_URLS=${OLLAMA_BASE_URLS}
    - ENABLE_SIGNUP=false
    - DEFAULT_LOCALE=en
    - session_length=86400
    # For Blablador: treat as OpenAI-compatible
    - OPENAI_API_KEY=${BLABLADOR_API_KEY}
  env_file:
    - ../.env
  secrets:
    - blablador_api_key
  volumes:
    - openwebui_data:/app/backend/data
  ports:
    - "8080:8080"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  mem_limit: 2g
  cpus: 1
  security_opt:
    - no-new-privileges:true
  networks:
    - italianollama-network

  # ============================================
  # Language Learning API - External services (Aura + Blablador)
  # ============================================
  language-learning-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.language-service
    container_name: italianollama-language-service
    environment:
      # Neo4j Aura connection (external cloud)
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - USE_AURA=${USE_AURA:-true}

      # AISuite configuration - Use Blablador (external)
      - AISUITE_PROVIDER=${AISUITE_PROVIDER:-blablador}

      # Blablador (Helmholtz LLM) - external API
      - BLABLADOR_API_URL=${BLABLADOR_API_URL}
      - BLABLADOR_MODEL=${BLABLADOR_MODEL:-alias-fast}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}

      # Hellmholtz configuration
      - HELMHOLTZ_CONFIG_PATH=/app/config/hellmholtz.yaml

      # General
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    secrets:
      - neo4j_aura_uri
      - neo4j_aura_username
      - neo4j_aura_password
      - neo4j_aura_database
      - blablador_api_key
      - blablador_api_url
      - blablador_model
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network
    user: "1000:1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # Neo4j Browser - Profile: local (debug)
  # ============================================
  neo4j-browser:
    image: neo4j:5.26-community
    container_name: italianollama-neo4j-browser
    profiles:
      - local
    environment:
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7473:7474"
    restart: unless-stopped
    depends_on:
      - neo4j
    security_opt:
      - no-new-privileges:true
    networks:
      - italianollama-network

# ============================================
# Volumes
# ============================================
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  ollama_models:
    driver: local
  openwebui_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  italianollama-network:
    driver: bridge
    name: italianollama-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# Secrets
# ============================================
secrets:
  neo4j_password:
    file: ../secrets/neo4j_password.txt
  webui_secret_key:
    file: ../secrets/webui_secret_key.txt
  openwebui_api_key:
    file: ../secrets/openwebui_api_key.txt
  blablador_api_key:
    file: ../secrets/blablador_api_key.txt
  blablador_api_url:
    file: ../secrets/blablador_api_url.txt
  blablador_model:
    file: ../secrets/blablador_model.txt
  # Neo4j Aura secrets (add these for aura profile)
  neo4j_aura_uri:
    file: ../secrets/neo4j_aura_uri.txt
  neo4j_aura_username:
    file: ../secrets/neo4j_aura_username.txt
  neo4j_aura_password:
    file: ../secrets/neo4j_aura_password.txt
  neo4j_aura_database:
    file: ../secrets/neo4j_aura_database.txt
