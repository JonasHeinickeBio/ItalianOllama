[project]
name = "italianollama"
version = "0.1.0"
description = "Lightweight Italian language learning assistant powered by private LLM and Neo4j."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
  "language-learning",
  "italian",
  "llm",
  "ollama",
  "fastapi",
  "neo4j",
  "langgraph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Natural Language :: English",
  "Natural Language :: Italian",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
authors = [
  { name = "Jonas Heinicke", email = "jonas.heinicke@helmholtz-hzi.de" },
]
maintainers = [
  { name = "Jonas Heinicke", email = "jonas.heinicke@helmholtz-hzi.de" },
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/JonasHeinickeBio/ItalianOllama"
"Source Code" = "https://github.com/JonasHeinickeBio/ItalianOllama"
"Bug Tracker" = "https://github.com/JonasHeinickeBio/ItalianOllama/issues"
"Documentation" = "https://github.com/JonasHeinickeBio/ItalianOllama#readme"
"Changelog" = "https://github.com/JonasHeinickeBio/ItalianOllama/releases"

[project.optional-dependencies]
test = [
  "pytest>=8.4.1",
  "pytest-asyncio>=0.25.0",
  "pytest-mock>=3.14.0",
  "pytest-benchmark>=5.1.0",
  "coverage>=7.9.1",
]
dev = [
  "black>=25.1.0",
  "ruff>=0.12.1",
  "mypy>=1.16.1",
  "bandit>=1.8.5",
  "pre-commit>=4.2.0",
]
lint = ["ruff>=0.12.1", "black>=25.1.0", "mypy>=1.16.1"]
format = ["black>=25.1.0", "ruff>=0.12.1"]

[project.scripts]
italianollama = "italianollama.cli.main:app"

[tool.semantic_release]
version_variable = ["src/italianollama/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install poetry && poetry build"
commit_author = "Jonas Heinicke (HZI) <jonas.heinicke@helmholtz-hzi.de>"

[tool.poetry]
# Poetry-specific configuration - metadata is in [project]
packages = [{ include = "italianollama", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Web Framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }

# Frontend - Chat Interface
chainlit = ">=2.0.0"

# Data Validation
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"

# Database & Memory
neo4j = "^5.26.0"

# LLM Workflow Orchestration
langgraph = "^1.1.3"

# CLI Tools
click = ">=8.1.0"
typer = ">=0.12.5,<0.16.0"

# Configuration & Utilities
pyyaml = "^6.0.2"
python-dotenv = ">=0.19"
httpx = "^0.28.0"

# Security
PyJWT = "^2.10.0"


[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.4.1"
pytest-asyncio = "^0.25.0"
pytest-mock = "^3.14.0"
pytest-benchmark = "^5.1.0"
coverage = "^7.9.1"

# Code Quality & Formatting
ruff = "^0.12.1"
mypy = "^1.16.1"
bandit = "^1.8.5"
pre-commit = "^4.2.0"

# Type Stubs
types-PyYAML = "6.0.12.20240311"
typing-extensions = "^4.14.0"


[tool.poetry.group.test.dependencies]
coverage = "^7.13.5"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "slow: mark test as slow (use '-m \"not slow\"' to skip)",
  "integration: mark test as integration (use '-m \"not integration\"' to skip)",
  "unit: mark test as unit (use '-m \"not unit\"' to skip)",
  "network: mark test that requires network access (use '-m \"not network\"' to skip)",
  "functional: mark test as functional (use '-m \"not functional\"' to skip)",
]
[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "docs",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
  "examples",
  "tests",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe complexity
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = ["E203", "E266", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["italianollama"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.coverage.run]
branch = true
source = ["italianollama"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50     # Set your desired test coverage threshold

[tool.bandit]
skips = ["B101", "B303"]
exclude_dirs = [
  "tests",
  "docs",
  "examples",
  ".venv",
  "dist",
  "build",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
]
paths = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = "(tests/|examples/)"
files = "src/"
disable_error_code = ["misc", "import-untyped"]
