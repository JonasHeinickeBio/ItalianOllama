# Hellmholtz Configuration for Language Learning
# Hellmholtz is an AI agent framework for scientific literature search and reasoning

# LLM Configuration
llm:
  provider: ollama  # or openai, anthropic, etc.
  model: llama3.2
  base_url: http://ollama:11434
  temperature: 0.7
  max_tokens: 4096
  timeout: 120

# Agent Configuration
agent:
  max_iterations: 10
  reflection_enabled: true
  memory_enabled: true
  verbose: true

# Language Learning specific settings
language_learning:
  target_language: italian
  difficulty_level: intermediate
  vocabulary_topics:
    - daily_conversation
    - food_and_dining
    - travel
    - healthcare
    - science
  grammar_topics:
    - verb_conjugations
    - article_usage
    - sentence_structure
    - subjunctive_mood
  
  # Learning prompts
  system_prompts:
    beginner: |
      You are a patient Italian language tutor for beginners.
      Use simple vocabulary and short sentences.
      Always provide translations and explanations in English.
      
    intermediate: |
      You are an Italian language tutor for intermediate learners.
      Use natural Italian phrases and idioms.
      Provide explanations in both Italian and English.
      
    advanced: |
      You are an advanced Italian language tutor.
      Discuss complex topics in Italian.
      Focus on nuance, idiom usage, and cultural context.

# Neo4j Memory Configuration
memory:
  connection:
    uri: bolt://neo4j:7687
    database: neo4j
    user: neo4j
    # password loaded from environment variable NEO4J_PASSWORD
  
  # Knowledge graph schema
  schema:
    node_labels:
      - Word
      - Phrase
      - GrammarRule
      - Topic
      - User
      - LearningSession
      - VocabularyItem
    
    relationship_types:
      - KNOWS
      - LEARNED
      - RELATED_TO
      - BELONGS_TO
      - PRACTICED
      - HAS_DIFFICULTY_WITH

# Search Configuration (for hellmholtz literature search capabilities)
search:
  databases:
    - europepmc
    - arxiv
  max_results: 10
  timeout: 30

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: /app/logs/hellmholtz.log
